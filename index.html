<title>Evaluación Estilos de Liderazgo</title>
<style>
/* VOICE: ejecutivo y sobrio, como un instrumento de assessment de consultora
   IDEA: la rueda D·I·S·C del aula es el hilo: se explora, acompaña cada respuesta y se llena con el perfil
   PICTURE: rueda grande sobre fondo oscuro en portada y resultados; cuadrantes de madurez en el tablero
   COLOUR and TYPE: marfil cálido y grafito profundo; ocho tonos joya apagados, uno por estilo; Arial
   LAYOUT: portada a pantalla completa; evaluación con panel de progreso fijo; resultados como tablero */
:root{color-scheme:light dark;--bg:light-dark(#f6f4f0,#101217);--ink:light-dark(#16181d,#eceae5);--mut:light-dark(#6c6a66,#a19e97);--line:light-dark(#e4e0d8,#2a2c33);--card:light-dark(#ffffff,#181a20);--soft:light-dark(#efece6,#15171c);--sh:light-dark(0 1px 2px rgba(22,24,29,.04),0 1px 2px rgba(0,0,0,.3)) ;--sh2:light-dark(0 12px 32px -12px rgba(22,24,29,.14),0 12px 32px -12px rgba(0,0,0,.6));
--s-dom:light-dark(#8e2b3a,#d98a95);--s-pio:light-dark(#a8582f,#e3a27c);--s-ene:light-dark(#a07a28,#e2c27a);--s-cap:light-dark(#3b7556,#8fc8a6);--s-afi:light-dark(#2b7378,#82c4c7);--s-par:light-dark(#355d8f,#93b3dc);--s-sis:light-dark(#4a4e8a,#a8abe2);--s-res:light-dark(#6b3a76,#c79bd1);--cD:light-dark(#2e9a7e,#5cc8a8);--cI:light-dark(#6b2fa0,#b58ae0);--cS:light-dark(#0b66b5,#6fb0ec);--cC:light-dark(#b80f1e,#f0707a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
.dark{--s-dom:#d98a95;--s-pio:#e3a27c;--s-ene:#e2c27a;--s-cap:#8fc8a6;--s-afi:#82c4c7;--s-par:#93b3dc;--s-sis:#a8abe2;--s-res:#c79bd1;--bg:#0c0e12;--ink:#f1efea;--mut:#9b988f;--line:rgba(255,255,255,.09);--card:rgba(255,255,255,.035);--soft:rgba(255,255,255,.03);--sh:none;--sh2:none;--cD:#5cc8a8;--cI:#b58ae0;--cS:#6fb0ec;--cC:#f0707a;background:radial-gradient(900px 520px at 78% 38%,#1b2030 0%,rgba(12,14,18,0) 70%),radial-gradient(700px 400px at 10% 110%,#191621 0%,rgba(12,14,18,0) 70%),#0c0e12;color:var(--ink);color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Arial,Helvetica,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:0 max(5vw,18px)}
h1{font-size:clamp(34px,5vw,54px);line-height:1.03;margin:0 0 18px;letter-spacing:-.03em;font-weight:700;text-wrap:balance}
h2{font-size:clamp(24px,3vw,32px);line-height:1.12;margin:0 0 12px;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:18px;margin:0 0 6px}
p{margin:0 0 14px;max-width:66ch}.mut{color:var(--mut)}.small{font-size:14px}.ri{font-style:italic}
.kicker{font-size:14px;color:var(--mut);margin-bottom:20px;display:flex;align-items:center;gap:12px}.kicker::before{content:'';width:28px;height:1px;background:currentColor;opacity:.7}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cS);outline-offset:2px}
.btn{min-height:50px;padding:12px 28px;letter-spacing:.01em;border:0;background:var(--ink);color:var(--bg);border-radius:999px;cursor:pointer;font-weight:700;font-size:16px;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.3;cursor:default;transform:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;min-height:44px;padding:0 8px}
/* portada */
.hero{padding:clamp(36px,6vw,80px) 0 clamp(36px,5vw,64px)}
.heroGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(24px,5vw,64px);align-items:center}
.lead{font-size:18px;color:var(--mut)}
.field{display:grid;gap:6px;margin:0 0 14px;max-width:440px}
.field span{font-weight:700;font-size:15px}
.field input{min-height:52px;padding:12px 18px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:16px;transition:border-color .2s}.field input:focus{border-color:var(--mut);outline:none}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:clamp(32px,5vw,56px) 0}
.how div{border-top:1px solid var(--line);padding-top:14px}.how b{display:block;font-size:20px;margin-bottom:4px}
.wheel{width:100%;max-width:560px;margin:0 auto;display:block;overflow:visible}
.wheel text{font:700 17px Arial,sans-serif;fill:var(--ink)}
.wheel .lab{cursor:pointer}.wheel .lab.on{text-decoration:underline;text-underline-offset:5px}
.qD{fill:color-mix(in srgb,var(--cD) 16%,var(--bg))}.qI{fill:color-mix(in srgb,var(--cI) 16%,var(--bg))}.qS{fill:color-mix(in srgb,var(--cS) 16%,var(--bg))}.qC{fill:color-mix(in srgb,var(--cC) 16%,var(--bg))}
.ring{fill:none;stroke:var(--line)}
.poly{fill:var(--ink);fill-opacity:.1;stroke:var(--ink);stroke-opacity:.85;stroke-width:2;stroke-linejoin:round;transform-origin:230px 230px;animation:grow 1s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{transform:scale(0);opacity:0}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--sh)}.dark .card{backdrop-filter:blur(6px)}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.hd h3{font-size:22px;margin:0 0 10px}.hd>span{font-size:14px;font-weight:700;color:var(--mut);white-space:nowrap}
#inf .card{margin-top:10px;min-height:136px}
.grid8{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0 clamp(40px,6vw,72px)}
.grid8 .card{cursor:pointer;text-align:start;transition:border-color .25s,transform .25s,box-shadow .25s;position:relative;overflow:hidden}.grid8 .card::after{content:'';position:absolute;inset:auto -30% -60% auto;width:70%;aspect-ratio:1;border-radius:50%;background:var(--sc);opacity:.07;transition:opacity .25s}.grid8 .card:hover::after,.grid8 .card.on::after{opacity:.16}
.grid8 .card:hover{transform:translateY(-3px);box-shadow:var(--sh2)}.grid8 .card.on{border-color:var(--sc);box-shadow:var(--sh2)}
/* evaluación */
.shell{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:28px 26px;display:flex;flex-direction:column;gap:22px;overflow:auto}
aside .brand{font-weight:700;line-height:1.35}aside .brand span{display:block;font-weight:400;color:var(--mut);font-size:14px}
aside .mw{width:180px;margin:0 auto}
.who{font-size:14px;color:var(--mut)}.who b{display:block;color:var(--ink);font-size:16px}
.steps{display:grid;gap:14px}
.st{display:grid;gap:6px;font-size:14px;color:var(--mut);background:none;border:0;text-align:start;padding:10px 12px;margin:0 -12px;border-radius:12px;cursor:pointer;transition:background .2s,color .2s}.st:hover:not(:disabled){background:rgba(255,255,255,.06);color:var(--ink)}.st.on{color:var(--ink);background:rgba(255,255,255,.08)}.st:disabled{cursor:default;opacity:.55}.st small{font-size:12px;color:var(--mut)}.st b{font-size:15px}
.st .tr{height:4px;border-radius:4px;background:var(--line);overflow:hidden}.st .tr i{display:block;height:100%;background:var(--ink);transition:width .4s}
aside .foot{margin-top:auto;font-size:13px;color:var(--mut)}
.stage{display:flex;flex-direction:column;justify-content:center;padding:clamp(28px,5vw,72px) clamp(18px,6vw,96px);min-height:100vh}
.scr{max-width:860px;width:100%;margin:0 auto;animation:in .38s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.cnt{font-size:14px;color:var(--mut);margin-bottom:22px}.cnt b{color:var(--ink);font-size:15px}
.stmt{font-size:clamp(26px,3.6vw,40px);line-height:1.18;font-weight:700;letter-spacing:-.01em;margin:0 0 30px;text-wrap:balance}
.stmt.sm{font-size:clamp(21px,2.6vw,28px);line-height:1.3}
.ask{font-weight:700;margin-bottom:12px}
.lik{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.lik button{min-height:100px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:border-color .15s,background .15s,transform .15s}
.lik button:hover,.opt:hover{border-color:var(--ink);transform:translateY(-1px)}
.lik b{font-size:28px}.lik small{font-size:13px;color:var(--mut);text-align:center}
.lik .sel,.opt.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}.lik .sel small{color:var(--bg)}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;align-items:start;text-align:start;padding:18px 20px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);border-radius:18px;cursor:pointer;font-size:17px;min-height:60px;transition:border-color .15s,transform .15s}
.opt i{font-style:normal;font-weight:700;width:32px;height:32px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:14px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:30px}
.hint{font-size:13px;color:var(--mut)}
.lv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:22px 0 6px}
.lv .card b{display:block;font-size:19px}
/* resultados */
.rh{padding:clamp(32px,5vw,64px) 0}
.rhGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(20px,4vw,56px);align-items:center}
.pname{font-size:clamp(40px,6vw,64px);font-weight:700;line-height:1;letter-spacing:-.02em;margin:6px 0 14px}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}
.duo .hd h3{font-size:19px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:clamp(28px,4vw,44px) 0}
.kpi{border:1px solid var(--line);border-radius:18px;padding:20px;background:var(--card);box-shadow:var(--sh)}
.kpi .v{font-size:30px;font-weight:700;line-height:1.1;margin:6px 0 4px}
.gauge{width:100%;max-width:200px;display:block}
.sec{padding:clamp(28px,4vw,48px) 0;border-top:1px solid var(--line)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,48px)}
.quad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qc{border-radius:18px;padding:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.qc .t{display:flex;justify-content:space-between;gap:8px;font-weight:700}.qc .t b{color:var(--c);font-size:18px}

const logo=(w)=>`<img class="nil" src="${LOGO}" width="${w}" height="${Math.round(w*132/320)}" alt="Next Idea Lab · Training & Consultancy">`;
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=s=>`<span style="color:var(--s-${s.k})">${s.n}</span>`;
let WID=0;
const tn=s=>`<tspan style="fill:var(--s-${s.k})">${s.n}</tspan>`;
const fillOf=s=>`var(--s-${s.k})`;
const P=(a,r)=>{const t=a*Math.PI/180;return[230+r*Math.cos(t),230+r*Math.sin(t)]};
const nA=()=>Object.keys(S.a).length,nS=()=>Object.keys(S.s).length;
function wheel(vals,act,mini){
  const R=140,id='w'+(++WID);let d='',h='';
  ST.forEach(s=>{d+=`<radialGradient id="${id}${s.k}" cx="230" cy="230" r="${R}" gradientUnits="userSpaceOnUse"><stop offset="0" style="stop-color:var(--s-${s.k});stop-opacity:0"/><stop offset="1" style="stop-color:var(--s-${s.k});stop-opacity:${mini?.75:act===s.k&&!vals?.6:.34}"/></radialGradient>`});
  ST.forEach(s=>{const[x1,y1]=P(s.a-22.5,R),[x2,y2]=P(s.a+22.5,R);h+=`<path d="M230 230L${x1} ${y1}A${R} ${R} 0 0 1 ${x2} ${y2}Z" fill="url(#${id}${s.k})"/>`});
  if(!mini)for(let k=1;k<=4;k++)h+=`<circle cx="230" cy="230" r="${R*k/5}" fill="none" stroke="var(--ink)" stroke-opacity=".08"/>`;
  ST.forEach(s=>{const[x1,y1]=P(s.a-22.5,R),[x2,y2]=P(s.a+22.5,R);h+=`<line x1="230" y1="230" x2="${x1}" y2="${y1}" stroke="var(--ink)" stroke-opacity=".1"/>`;
    const r2=R+(mini?9:8),[a1,b1]=P(s.a-20.5,r2),[a2,b2]=P(s.a+20.5,r2);h+=`<path d="M${a1} ${b1}A${r2} ${r2} 0 0 1 ${a2} ${b2}" fill="none" style="stroke:var(--s-${s.k})" stroke-width="${mini?12:act===s.k&&!vals?10:6}" stroke-linecap="round"/>`});
  [[-135,'D'],[-45,'I'],[45,'S'],[135,'C']].forEach(([an,l])=>{const[lx,ly]=P(an,R*.56);h+=`<text x="${lx}" y="${ly+9}" text-anchor="middle" style="fill:var(--ink);fill-opacity:${vals?.25:.55};font-size:${mini?30:24}px;font-weight:700">${l}</text>`});
  if(vals)h+=`<polygon class="poly" points="${ST.map(s=>P(s.a,R*vals[s.k]/5).join(',')).join(' ')}"/>`+ST.map(s=>{const[x,y]=P(s.a,R*vals[s.k]/5);return`<g class="pt" data-k="${s.k}" tabindex="0" role="button" aria-label="${s.n}: ${vals[s.k].toFixed(1)}"><circle cx="${x}" cy="${y}" r="18" fill="transparent"/><circle class="dot" cx="${x}" cy="${y}" r="6.5" style="fill:var(--s-${s.k})" stroke="var(--bg)" stroke-width="2.5"/></g>`}).join('');
  if(!mini)ST.forEach(s=>{const[x,y]=P(s.a,R+34),c=Math.cos(s.a*Math.PI/180),an=c>.3?'start':c<-.3?'end':'middle';h+=`<text class="lab${act===s.k?' on':''}" data-k="${s.k}" x="${x}" y="${y+6}" text-anchor="${an}" tabindex="0" role="button" aria-label="${s.n}">${tn(s)}${vals?`<tspan style="fill:var(--mut);font-weight:400"> ${vals[s.k].toFixed(1)}</tspan>`:''}</text>`});
  return`<svg class="wheel" viewBox="${mini?'76 76 308 308':'-90 -10 640 480'}" role="img" aria-label="Rueda de los 8 estilos sobre los comportamientos D, I, S y C"><defs>${d}</defs>${h}</svg>`}
const card=(s,extra='')=>`<div class="hd"><h3>${nm(s)}</h3><span>${s.c}</span></div><p class="small" style="margin:0">${extra}<b>Brilla:</b> ${s.br}<br><b>Riesgo:</b> <span class="ri">${s.ri}</span></p>`;
function score(){const v={};ST.forEach(s=>{const xs=IT.map((x,j)=>x[0]===s.k?S.a[j]:null).filter(x=>x!=null);v[s.k]=xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:0});return v}

function intro(){
  const started=nA()>0;
  return`<div class="hero dark"><div class="wrap topbar">${logo(240)}</div><div class="wrap heroGrid"><div>
  <h1>Evaluación de Estilo de Liderazgo</h1>
  <p class="lead">Esta autoevaluación sirve para que los líderes de las distintas organizaciones identifiquen el estilo de liderazgo que más los representa. Ningún estilo es bueno o malo: es apropiado o inapropiado según la tarea y la madurez de quien la recibe.</p>
  <div id="f" style="margin-top:26px">
   <label class="field"><span>Tu nombre</span><input id="nm" type="text" autocomplete="name" value="${esc(S.name)}" placeholder="Nombre y apellido"></label>
   <label class="field"><span>Tu rol en la organización</span><input id="rl" type="text" autocomplete="organization-title" value="${esc(S.role)}" placeholder="Ej.: Director de TI"></label>
   <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px"><button class="btn" type="button" id="start">${started?'Continuar donde quedé':'Comenzar la evaluación'}</button>${started?'<button class="link" type="button" id="reset">Empezar de nuevo</button>':''}</div>
  </div></div>
  <div>${wheel(null,S.sel)}<div id="inf"><div class="card">${card(SN[S.sel])}</div></div></div></div></div>
  <div class="wrap"><div class="how k2">
   <div><b>24 afirmaciones</b><span class="mut">Cómo lideras habitualmente, de 1 (nunca) a 5 (siempre). Unos 6 minutos.</span></div>
   <div><b>Resultados</b><span class="mut">Tu estilo predominante con su comportamiento y tus 8 estilos en la rueda.</span></div></div>
  <h2>Los 8 estilos sobre 4 comportamientos</h2><p class="mut">Cada estilo combina uno o dos comportamientos: D Dominancia, I Influencia, S Estabilidad y C Cumplimiento. Toca una tarjeta o la rueda para explorarlos.</p>
  <div class="grid8">${['dom','pio','ene','cap','afi','par','sis','res'].map(k=>`<button class="card${k===S.sel?' on':''}" data-c="${k}" style="--sc:var(--s-${k})">${card(SN[k])}</button>`).join('')}</div><div class="ref" style="margin-bottom:clamp(40px,6vw,72px)">${FOOT}${SHEETS_URL?'<p style="margin:10px 0 0"><a href="#grupo" style="color:var(--ink)">Ver resultados del grupo</a></p>':''}</div></div>`}

function aside(sc){
  const ia=nA(),cur=sc.t==='item'?0:1;
  const st=[['Evaluación','Tu forma de liderar',ia,IT.length,`${ia} de ${IT.length} respondidas`],['Resultados','Tu perfil',done()?1:0,1,done()?'Listos para ver':'Completa las 24 respuestas']];
  return`<aside class="dark"><div class="brand">Evaluación de Estilo de Liderazgo</div>
  <div class="mw">${wheel(null,null,true)}</div>
  ${S.name||S.role?`<div class="who"><b>${esc(S.name)||'Director'}</b>${esc(S.role)}</div>`:''}
  <nav class="steps" aria-label="Secciones">${st.map(([a,b,n,t,m],k)=>`<button class="st${k===cur?' on':''}" data-go="${k}" ${k===1&&!done()?'disabled':''} ${k===cur?'aria-current="step"':''}><div><b>${a}</b> <span>· ${b}</span></div><div class="tr"><i style="width:${n/t*100}%"></i></div><small>${m}</small></button>`).join('')}</nav>
  <div class="afoot">${logo(220)}</div></aside>`}

function item(j){const it=IT[j],v=S.a[j];return`<section class="scr"><div class="cnt"><b>Afirmación ${j+1} de ${IT.length}</b> · Tu forma habitual de liderar</div>
  <p class="stmt">${it[1]}</p><p class="ask">¿Con qué frecuencia lo haces?</p>
  <div class="lik">${LAB.map((l,k)=>`<button data-v="${k+1}" class="${v===k+1?'sel':''}"><b>${k+1}</b><small>${l}</small></button>`).join('')}</div>${nav(v!=null,'Teclas 1 a 5')}</section>`}
const done=()=>nA()===IT.length;

    document.addEventListener('keydown',e=>{if(e.key==='Escape'){pinned=null;tip.hidden=true}});
    $('rev').onclick=()=>{S.i=1;save();render();window.scrollTo(0,0)};syncResult();
    $('again').onclick=()=>{S={i:0,name:'',role:'',a:{},s:{},sel:'dom',id:uid()};save();render();window.scrollTo(0,0)}}}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const sc=SCR[S.i];const k=e.key.toUpperCase();
  if(sc.t==='item'&&/^[1-5]$/.test(k))root.querySelector(`[data-v="${k}"]`)?.click();
  else if(e.key==='ArrowRight'){const n=document.getElementById('next');if(n&&!n.disabled)go(1)}
  else if(e.key==='ArrowLeft'&&sc.t!=='intro'&&sc.t!=='res')go(-1)});
render()
